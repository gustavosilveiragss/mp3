[platformio]
; mp3sd_fast usa outra plataforma e o PlatformIO 6.2 (~/.platformio/penv/bin/pio): fora do gate.
default_envs = mp3, mp3sim, mp3sd, bt_test

[env:mp3]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -std=gnu++2a -DMRM_LOG=1 -DMP3_SD=0 -DMP3_BATTERY=0 -DCORE_DEBUG_LEVEL=0 -Wl,--wrap=bta_av_co_audio_get_sbc_config
    -DMRM_MP3_RING_BYTES=10240 -DMRM_MP3_IN_BYTES=2560 -DMRM_MP3_STACK_BYTES=4608
    -DHTTP_RAW_BUFLEN=4096 -DHTTP_UPLOAD_BUFLEN=4096
build_src_flags = -Wall -Wextra -Wshadow -Wformat=2 -Wstack-usage=1024 -Werror
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/gustavosilveiragss/marmota-fmk.git#v0.22.3
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
build_src_filter = +<*> -<bt_test.cpp> -<AudioSim.cpp>

; Mesma UI com fones falsos, sem Bluetooth: para usar o aparelho sem fone por perto.
[env:mp3sim]
extends = env:mp3
lib_deps = https://github.com/gustavosilveiragss/marmota-fmk.git#v0.22.3
build_src_filter = +<*> -<bt_test.cpp> -<Audio.cpp> -<AudioBonds.cpp> -<AudioDebug.cpp>

; Mesma UI com a midia no microSD (modulo HW-125).
[env:mp3sd]
extends = env:mp3
build_flags = ${env:mp3.build_flags} -DMP3_SD=1
build_unflags = -std=gnu++11 -DMP3_SD=0

[env:bt_test]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -std=gnu++2a -DBT_TARGET=\"\" -DBT_PIN=\"\" -DBT_AMP=6000 -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
build_src_filter = -<*> +<bt_test.cpp>
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7

; Experimento: Arduino 3.x com lwIP recompilado (janela TCP maior). Nao e o env de producao.
[env:mp3sd_fast]
; Fora do gate: sem -Werror/-Wstack-usage (os headers do Arduino 3 geram avisos). O mesmo codigo passa pelo lint nos envs acima.
extends = env:mp3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
build_flags = -std=gnu++2a -DMRM_LOG=0 -DMP3_SD=1 -DMP3_BATTERY=0 -DCORE_DEBUG_LEVEL=0 -Wl,--wrap=bta_av_co_audio_get_sbc_config
    -DMRM_MP3_RING_BYTES=10240 -DMRM_MP3_IN_BYTES=2560 -DMRM_MP3_STACK_BYTES=4608
    -DHTTP_RAW_BUFLEN=4096 -DHTTP_UPLOAD_BUFLEN=4096
build_src_flags = -Wall
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=16384
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=16
    CONFIG_BLE_MESH=n
    CONFIG_BT_BLE_ENABLED=n
    CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
    CONFIG_BT_HFP_ENABLE=n
    CONFIG_BT_SPP_ENABLED=n
    CONFIG_BT_AVRCP_CT_COVER_ART_ENABLED=n
    CONFIG_BT_ACL_CONNECTIONS=2
