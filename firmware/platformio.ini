[env:mp3]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -std=gnu++2a -DMRM_LOG=1 -DMP3_SD=0 -DMP3_BATTERY=0 -DCORE_DEBUG_LEVEL=0 -Wl,--wrap=bta_av_co_audio_get_sbc_config
build_src_flags = -Wall -Wextra -Wshadow -Wformat=2 -Wstack-usage=1024 -Werror
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/gustavosilveiragss/marmota-fmk.git#v0.22.1
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
build_src_filter = +<*> -<bt_test.cpp> -<AudioSim.cpp>

; Mesma UI com fones falsos, sem Bluetooth: para usar o aparelho sem fone por perto.
[env:mp3sim]
extends = env:mp3
lib_deps = https://github.com/gustavosilveiragss/marmota-fmk.git#v0.22.1
build_src_filter = +<*> -<bt_test.cpp> -<Audio.cpp>

[env:bt_test]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -std=gnu++2a -DBT_TARGET=\"\" -DBT_PIN=\"\" -DBT_AMP=6000 -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
build_src_filter = -<*> +<bt_test.cpp>
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
