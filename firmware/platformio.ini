; Unico env. Arduino 3.x (pioarduino) com lwIP recompilado: precisa do PlatformIO 6.2, entao use scripts/pio.sh
; (gate, build e gravacao). O firmware.bin tem que caber em app0 (partitions.csv): scripts/check.sh confere.
[env:mp3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -std=gnu++2a -DMRM_LOG=0 -DCORE_DEBUG_LEVEL=0 -Wl,--wrap=bta_av_co_audio_get_sbc_config
    -DMRM_MP3_RING_BYTES=10240 -DMRM_MP3_IN_BYTES=2560 -DMRM_MP3_STACK_BYTES=4608
    -DHTTP_RAW_BUFLEN=4096 -DHTTP_UPLOAD_BUFLEN=4096
; Sem -Werror: os headers do Arduino 3 geram avisos. O gate reprova qualquer aviso que venha de src/.
build_src_flags = -Wall -Wextra -Wshadow -Wformat=2 -Wstack-usage=1024
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/gustavosilveiragss/marmota-fmk.git#v0.24.0
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
; Bluetooth enxuto (heap livre com BT ~57 KB; o padrao deixava ~27 KB e o SBC nao alocava) e janela TCP maior.
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=16384
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=16
    CONFIG_BLE_MESH=n
    CONFIG_BT_BLE_ENABLED=n
    CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
    CONFIG_BT_HFP_ENABLE=n
    CONFIG_BT_SPP_ENABLED=n
    CONFIG_BT_AVRCP_CT_COVER_ART_ENABLED=n
    CONFIG_BT_ACL_CONNECTIONS=2
