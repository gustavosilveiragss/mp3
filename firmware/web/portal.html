<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>marmota mp3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f4;--surface:#fff;--border:rgba(0,0,0,.09);--text:#111;--muted:#666;--error:#b42318;--warn:#a15c07}
html,body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;accent-color:#111}
body{padding:24px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main,#boot,#end{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:15px;font-weight:500;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:15px;font-weight:500}
small,.muted{color:var(--muted);font-size:12px}
#lang button{background:none;border:0;font:inherit;color:var(--muted);padding:4px;cursor:pointer}
#lang button.on{color:var(--text);text-decoration:underline}
#status{font-size:12px;color:var(--muted);margin-top:-14px}
#status.off{color:var(--error)}
section{display:flex;flex-direction:column;gap:10px}
.bar{position:relative;height:8px;background:rgba(0,0,0,.08);border-radius:8px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--text);transition:width .15s,left .15s}
.bar i.planned{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px);opacity:.45}
.bar.over i.planned{color:var(--error);opacity:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;display:block;line-height:42px;text-align:center;border-radius:8px;min-width:0;
  border:1px solid var(--text);background:var(--text);color:#fff;font:inherit;font-weight:500;cursor:pointer;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.ghost{background:transparent;color:var(--text);border-color:rgba(0,0,0,.25)}
button:disabled{opacity:.4;cursor:default}
input[type=file]{display:none}
input[type=text]{width:100%;min-height:40px;border:1px solid rgba(0,0,0,.2);border-radius:8px;padding:0 10px;font:inherit;background:var(--surface);color:var(--text)}
label.check-row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
ul{list-style:none;display:flex;flex-direction:column}
#queue li{padding:8px 0;animation:fade-in .15s ease-out}
.line{display:flex;align-items:center;gap:8px;min-width:0}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name>*{display:block;overflow:hidden;text-overflow:ellipsis}
.line-progress{display:block;height:2px;margin-top:6px;border-radius:2px;overflow:hidden}
.line-progress i{display:block;height:100%;width:0;background:var(--text);transition:width .15s}
.status-chip{font-size:11px;font-weight:500;padding:1px 8px;border-radius:10px;background:rgba(0,0,0,.06);color:var(--muted);white-space:nowrap}
.status-chip.check,.status-chip.send{color:var(--text);animation:pulse 1s ease-in-out infinite}
.status-chip.ok{background:var(--text);color:#fff}
.status-chip.ok::before{content:"✓ ";display:inline-block;animation:check-pop .25s ease-out}
.status-chip.err{background:#fde8e6;color:var(--error)}
.status-chip.warn{background:#fdf0dc;color:var(--warn)}
.note{font-size:12px;color:var(--warn)}
.note.error,.hint.error{color:var(--error)}
.destination{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:10px;border:1px solid rgba(0,0,0,.25);color:var(--text);animation:fade-in .2s ease-out}
.destination small{color:var(--muted)}
.destination b{font-size:16px;font-weight:600}
.destination .btn{flex:none;min-height:36px;line-height:34px}
.destination.missing{border-color:var(--warn);color:var(--warn)}
.destination.missing small{color:var(--warn)}
.destination.missing .btn{border-color:var(--warn);color:var(--warn)}
.flash{animation:flash-pop .5s ease-out}
#send{flex:1 1 100%}
label.btn{display:flex;align-items:center;justify-content:center}
#folderAsk .btn{white-space:normal;line-height:1.3;padding:10px 12px}
#folderAsk{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);animation:fade-in .2s ease-out}
.library-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#playlists{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;animation:fade-in .15s ease-out;transition:border-color .15s}
.card.active{border-color:var(--text)}
.card-head{display:flex;align-items:center;gap:8px;padding-right:8px;min-height:52px}
.card-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;font:inherit;color:inherit;text-align:left;padding:6px 0 6px 12px;cursor:pointer;min-height:52px}
.card-toggle::before{content:"›";color:var(--muted);transition:transform .15s}
.open .card-toggle::before{transform:rotate(90deg)}
.card-toggle .title{font-weight:500}
.card-head>input{flex:1;margin-left:12px}
.add-btn{flex:none;min-height:34px;border-radius:17px;border:0;background:var(--text);color:#fff;font:inherit;font-size:13px;font-weight:500;padding:0 14px;cursor:pointer;white-space:nowrap}
.card:not(.open) .card-body{display:none}
.card-body{padding:0 12px;animation:fade-in .15s ease-out}
.card-body li{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;border-top:1px solid var(--border);animation:fade-in .15s ease-out}
.card-body li>input{min-height:30px;flex:1}
li .action{min-width:30px;min-height:32px;padding:4px}
.action:disabled{opacity:.25}
.card-actions{display:flex;gap:6px;justify-content:flex-end;padding-bottom:10px;padding-top:6px;border-top:1px solid var(--border)}
.action{background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:4px 6px;cursor:pointer;border-radius:6px}
.action.armed{background:var(--error);color:#fff}
.picker{flex:1 0 100%;display:flex;flex-direction:column;gap:10px;padding:10px;margin:4px 0;border-radius:10px;background:var(--bg);animation:fade-in .15s ease-out}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:212px;overflow-y:auto}
.chip{max-width:100%;min-height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:20px;border:1px solid rgba(0,0,0,.2);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.chip .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--text);color:#fff}
.chip.on small{color:rgba(255,255,255,.65)}
.name-box{display:flex;flex-direction:column;gap:4px;animation:fade-in .15s ease-out}
.name-box .row{flex-wrap:nowrap}
.name-box .btn{flex:none}
.hint{font-size:12px;color:var(--muted);min-height:18px}
.busy #library button,.busy #folderBtn{pointer-events:none;opacity:.4}
.busy #destChange{display:none}
footer{display:flex;flex-direction:column;gap:8px;text-align:center}
footer a{color:var(--text)}
#boot{align-items:center;padding-top:30vh;flex-direction:row;justify-content:center;gap:6px}
#boot i{width:8px;height:8px;border-radius:50%;background:var(--text);animation:pulse 1s infinite}
#end{padding-top:25vh;text-align:center}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes check-pop{from{transform:scale(0)}60%{transform:scale(1.4)}}
@keyframes flash-pop{from{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot"><i></i></div>
<p id="bootOffline" class="muted" hidden style="text-align:center"></p>
<main id="app" hidden>
  <header>
    <h1 id="deviceName"></h1>
    <nav id="lang"><button data-lang="pt">pt</button><span class="muted">|</span><button data-lang="en">en</button></nav>
  </header>
  <p id="status"></p>
  <section>
    <div class="bar" id="space"><i id="spaceUsed"></i><i id="spacePlanned" class="planned"></i></div>
    <small id="spaceText"></small>
  </section>
  <section id="queueSection" hidden>
    <div id="destination" class="destination"><div class="name"><small data-text="destination"></small><b id="destName"></b><small id="destInfo"></small></div><button class="btn ghost" id="destChange"></button></div>
    <div id="destPicker"></div>
    <div id="folderAsk" hidden><small id="askText"></small><button class="btn" id="askExisting"></button><button class="btn ghost" id="askNew"></button></div>
    <ul id="queue"></ul>
    <label class="check-row"><input type="checkbox" id="keepOrder" checked><span data-text="keepOrder"></span></label>
    <p id="queueNote" class="note" hidden></p>
    <div class="bar"><i id="totalBar"></i></div>
    <div class="row"><button class="btn" id="send"></button><button class="btn ghost" id="cancel"></button></div>
  </section>
  <section id="library">
    <div class="library-head"><h2 data-text="library"></h2><small id="libraryCount"></small></div>
    <div class="row">
      <button class="btn ghost" id="newPlaylistBtn" data-text="newPlaylist"></button>
      <label class="btn ghost" id="folderBtn"><input type="file" id="folderInput" webkitdirectory multiple><span data-text="folder"></span></label>
    </div>
    <input type="file" id="filesInput" multiple accept=".mp3,audio/mpeg">
    <div id="newPlaylistSlot"></div>
    <input type="text" id="filter" data-placeholder="find" autocomplete="off" hidden>
    <p id="libraryNote" class="note" hidden></p>
    <div id="playlists"></div>
  </section>
  <footer>
    <button class="btn ghost" id="done" data-text="done"></button>
    <small data-text="keepScreenOn"></small>
    <small data-text="fastTip"></small>
    <small><span data-text="openInBrowser"></span> <a href="http://192.168.4.1" target="_blank">http://192.168.4.1</a></small>
  </footer>
</main>
<div id="end" hidden><p data-text="bye"></p></div>
<script>
'use strict';
const TEXTS = {
  pt: {
    folder: 'enviar pasta', newPlaylist: '+ nova playlist', add: '+ adicionar músicas', create: 'escolher músicas', playlistPlaceholder: 'nome da playlist',
    keepOrder: 'manter ordem (01, 02…)', find: 'buscar playlist', destination: 'destino', existing: 'existente · $1 faixas', fresh: 'nova playlist',
    swap: 'trocar', findOrCreate: 'buscar ou criar', move: 'mover', nothing: 'nada a enviar', pick: 'escolher', choose: 'escolha uma playlist', sendTo: 'enviar $1 músicas para $2', sendTo1: 'enviar 1 música para $2',
    askText: 'a pasta "$1" já existe na biblioteca', askExisting: 'adicionar à existente "$1"', askNew: 'criar nova "$1"',
    name_free: 'nova playlist "$1"', name_dup: '"$1" já existe', name_bad: 'sem / \\ : * ? " < > |', name_long: 'máximo de $2 caracteres', name_full: 'limite de $3 playlists',
    cancel: 'cancelar', clear: 'limpar', stop: 'parar', library: 'biblioteca', count: '$1 de $2 playlists', none: 'biblioteca vazia. crie uma playlist ou envie uma pasta.',

    wait: 'esperando', check: 'checando', ok: 'ok', skip: 'pulado', tracks: '$1 faixas', track1: '1 faixa',
    rename: 'renomear', delete: 'apagar', sure: 'apagar?', up: 'subir', down: 'descer', moveTo: 'mover para…', loose: 'soltos', more: '$1+ arquivos',
    ignored: '$1 ignorados (não são .mp3)', rate: '$1 com taxa que o aparelho não toca (só 44,1 e 48 kHz)',
    playlistsFull: 'limite de $1 playlists', tracksFull: 'limite de $1 faixas',
    bye: 'pronto. o aparelho saiu do modo wi-fi, pode fechar esta página.',
    error_num: 'sem número "NN - " nos dois nomes', error_name: 'nome inválido', error_space: 'sem espaço', error_exists: 'já existe', error_limit: 'limite', error_notmp3: 'não é mp3',
    error_io: 'erro de gravação', error_big: 'grande demais', error_net: 'sem conexão'
  },
  en: {
    folder: 'send folder', newPlaylist: '+ new playlist', add: '+ add music', create: 'choose music', playlistPlaceholder: 'playlist name',
    keepOrder: 'keep order (01, 02…)', find: 'find playlist', destination: 'destination', existing: 'existing · $1 tracks', fresh: 'new playlist',
    swap: 'change', findOrCreate: 'find or create', move: 'move', nothing: 'nothing to send', pick: 'choose', choose: 'choose a playlist', sendTo: 'send $1 songs to $2', sendTo1: 'send 1 song to $2',
    askText: 'folder "$1" is already in the library', askExisting: 'add to existing "$1"', askNew: 'create new "$1"',
    name_free: 'new playlist "$1"', name_dup: '"$1" already exists', name_bad: 'no / \\ : * ? " < > |', name_long: 'at most $2 characters', name_full: 'limit of $3 playlists',
    cancel: 'cancel', clear: 'clear', stop: 'stop', library: 'library', count: '$1 of $2 playlists', none: 'empty library. create a playlist or send a folder.',
    done: 'finish', keepScreenOn: 'keep the screen on while sending',
    fastTip: 'in a hurry, or sending a lot of music? over wi-fi it is a bit slow, that is the device\'s limit. the fastest way is to take out the microSD card, plug it into a computer and copy the songs straight onto it (inside the music folder, one folder per playlist).', openInBrowser: 'picker did not open? open in the browser:',
    ready: 'ready', sending: 'sending $1 of $2', off: 'no connection · retrying',
    finished: 'done · $1 sent, $2 skipped, $3 failed',
    space: '$1 of $2 used · $3 free', spaceQueued: ' · queue $1', doesNotFit: ' · does not fit, $1 short',
    wait: 'waiting', check: 'checking', ok: 'ok', skip: 'skipped', tracks: '$1 tracks', track1: '1 track',
    rename: 'rename', delete: 'delete', sure: 'delete?', up: 'up', down: 'down', moveTo: 'move to…', loose: 'loose', more: '$1+ files',
    ignored: '$1 ignored (not .mp3)', rate: '$1 at a rate the player cannot play (only 44.1 and 48 kHz)',
    playlistsFull: 'limit of $1 playlists', tracksFull: 'limit of $1 tracks',
    bye: 'done. the device left wi-fi mode, you can close this page.',
    error_num: 'both names need a "NN - " number', error_name: 'bad name', error_space: 'no space', error_exists: 'exists', error_limit: 'limit', error_notmp3: 'not mp3',
    error_io: 'write error', error_big: 'too big', error_net: 'no connection'
  }
};

const STATE_RETRY_MS = 2000;
const ARM_CONFIRM_MS = 3000;
const MAX_NET_RETRIES = 3;
const SNIFF_CHUNK_BYTES = 65536;
const ID3_HEADER_BYTES = 10;
const UNLIMITED_NAME_BYTES = 999;
const QUEUE_NAME_MAX_BYTES = 200;
const FILTER_MIN_PLAYLISTS = 7;
const UPLOAD_ID_STEP = 1000;
const MPEG_VERSION_1 = 3;
const MPEG_VERSION_2 = 2;
const PLAYABLE_RATES = [44100, 48000];
const SERVER_ERRORS_AFTER_DROP = ['name', 'space', 'notmp3', 'limit', 'exists'];
// Linhas: MPEG1 e MPEG2/2.5; colunas: indice de bitrate do cabecalho Layer III.
const BITRATES_KBPS = [[0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320], [0, 8, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 144, 160]];
const BAD_CHARS = /[\x00-\x1f\x7f\/\\:*?"<>|]/g;
const ICONS = { up: '↑', down: '↓', moveTo: '→', rename: '✎', delete: '✕' };

const byId = id => document.getElementById(id);
const queryAll = selector => document.querySelectorAll(selector);
const makeElement = (tag, html) => Object.assign(document.createElement(tag), html ? { innerHTML: html } : {});
const encoder = new TextEncoder();
const byteLength = text => encoder.encode(text).length;
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const toQueryString = params => Object.keys(params).map(key => key + '=' + encodeURIComponent(params[key])).join('&');
const isPlayableRate = rate => PLAYABLE_RATES.includes(rate);

let state = null;
let lang = 'pt';
let looseTracks = [];
let looseMore = 0;
let queue = [];
let batch = null;
let uploading = false;
let currentRequest = null;
let shownStatus = ['ready', []];
let ignoredCount = 0;
let uploadSeq = Math.floor(Math.random() * 1e6) * UPLOAD_ID_STEP;
let destPlaylist = '';
let wantedDest = null;
let folderAsk = null;
const trackCache = {};

function translate(key, ...args) {
  return (TEXTS[lang][key] || key).replace(/\$(\d)/g, (match, index) => args[index - 1]);
}

const trackCount = count => translate(count == 1 ? 'track1' : 'tracks', count);

function formatSize(bytes) {
  const text = bytes < 1e6 ? Math.round(bytes / 1024) + ' kb' : (bytes / 1048576).toFixed(1) + ' mb';
  return lang == 'pt' ? text.replace('.', ',') : text;
}

function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem('lang'); } catch {}
  return /^pt/i.test(saved || (state && state.lang) || navigator.language || '') ? 'pt' : 'en';
}

function setLang(newLang) {
  lang = newLang;
  document.documentElement.lang = newLang == 'pt' ? 'pt-BR' : 'en';
  queryAll('[data-text]').forEach(el => el.textContent = translate(el.dataset.text));
  queryAll('[data-placeholder]').forEach(el => el.placeholder = translate(el.dataset.placeholder));
  queryAll('#lang button').forEach(button => button.classList.toggle('on', button.dataset.lang == newLang));
  byId('destPicker').textContent = byId('newPlaylistSlot').textContent = '';
  drawAll();
  drawLibrary();
}

// Os POST levam X-Mrm e X-Q (a query repetida) porque o aparelho confere os dois.
async function api(path, post) {
  const options = post ? { method: 'POST', headers: { 'X-Mrm': '1', 'X-Q': path.split('?')[1] }, cache: 'no-store' } : { cache: 'no-store' };
  const response = await fetch(path, options);
  const json = await response.json().catch(() => ({}));
  if (!response.ok || json.e) throw { code: json.e || 'io' };
  return json;
}

async function loadLooseTracks() {
  try {
    const json = await api('/api/loose');
    looseTracks = json.t;
    looseMore = json.more;
  } catch {}
}

async function waitForState() {
  for (;;) {
    try { state = await api('/api/state'); return; } catch {}
    setBanner('off');
    await sleep(STATE_RETRY_MS);
  }
}

// Mesmas regras do PathRules.h, em bytes UTF-8 como o strlen do aparelho.
function sanitizeName(name, maxBytes) {
  name = name.normalize('NFC').replace(BAD_CHARS, ' ').replace(/\s+/g, ' ').replace(/^[ .]+|[ .]+$/g, '');
  while (byteLength(name) > maxBytes) name = Array.from(name).slice(0, -1).join('').replace(/[ .]+$/, '');
  return name;
}

// Nome exato primeiro; senao sem caixa, porque no FAT do SD "Rock" e "rock" sao a mesma pasta.
const findPlaylist = name => state.pl.find(pl => pl.n == name) || state.pl.find(pl => pl.n.toLowerCase() == name.toLowerCase());

// Nome digitado para playlist nova: free, dup (ja existe), bad, long ou full.
function checkName(typed) {
  const name = sanitizeName(typed, UNLIMITED_NAME_BYTES);
  if (!typed.trim()) return { kind: '' };
  if (!name || typed.search(BAD_CHARS) >= 0) return { kind: 'bad' };
  if (byteLength(name) > state.lim.plLen) return { kind: 'long' };
  const existing = findPlaylist(name);
  if (existing) return { kind: 'dup', name: existing.n };
  return { kind: state.pl.length >= state.lim.pl ? 'full' : 'free', name };
}

// Primeiro "nome N" livre, cortando o nome para caber o sufixo.
function uniquePlaylistName(name) {
  for (let n = 2; ; n++) {
    const candidate = sanitizeName(name, state.lim.plLen - byteLength(' ' + n)) + ' ' + n;
    if (!findPlaylist(candidate)) return candidate;
  }
}

const stripNumberAndExtension = name => name.replace(/\.mp3$/i, '').replace(/^\d+ - /, '');

// Espelha Mp3Sniff: pula ID3 e exige cabecalho MPEG Layer III, conferindo o frame seguinte.
function parseFrame(bytes, offset) {
  if (bytes[offset] != 0xff || (bytes[offset + 1] & 0xe0) != 0xe0) return null;
  const version = (bytes[offset + 1] >> 3) & 3;
  const layer = (bytes[offset + 1] >> 1) & 3;
  const bitrateIndex = bytes[offset + 2] >> 4;
  const rateIndex = (bytes[offset + 2] >> 2) & 3;
  const padding = (bytes[offset + 2] >> 1) & 1;
  if (version == 1 || layer != 1 || bitrateIndex == 0 || bitrateIndex == 15 || rateIndex == 3) return null;
  const isMpeg1 = version == MPEG_VERSION_1;
  const sampleRate = [44100, 48000, 32000][rateIndex] / (isMpeg1 ? 1 : version == MPEG_VERSION_2 ? 2 : 4);
  const bitrateKbps = BITRATES_KBPS[isMpeg1 ? 0 : 1][bitrateIndex];
  const length = Math.floor((isMpeg1 ? 144 : 72) * bitrateKbps * 1000 / sampleRate) + padding;
  return { sampleRate, length };
}

async function sniffSampleRate(file) {
  let offset = 0;
  for (;;) {
    const bytes = new Uint8Array(await file.slice(offset, offset + SNIFF_CHUNK_BYTES).arrayBuffer());
    if (bytes.length < ID3_HEADER_BYTES) return 0;
    if (bytes[0] == 0x49 && bytes[1] == 0x44 && bytes[2] == 0x33) {
      const tagSize = bytes[6] << 21 | bytes[7] << 14 | bytes[8] << 7 | bytes[9];
      const footerSize = bytes[5] & 0x10 ? 10 : 0;
      offset += ID3_HEADER_BYTES + tagSize + footerSize;
      continue;
    }
    for (let i = 0; i + 4 <= bytes.length; i++) {
      const frame = parseFrame(bytes, i);
      if (!frame) continue;
      const next = i + frame.length;
      if (next + 4 > bytes.length || parseFrame(bytes, next)) return frame.sampleRate;
    }
    return 0;
  }
}

async function fetchTracks(playlist, forceReload) {
  if (!state.pl.some(pl => pl.n == playlist)) return [];
  if (forceReload || !trackCache[playlist]) trackCache[playlist] = (await api('/api/tracks?' + toQueryString({ p: playlist }))).t;
  return trackCache[playlist];
}

// Remove da fila (e da tela) quem nao passa no filtro.
function keepOnly(shouldKeep) {
  queue = queue.filter(item => shouldKeep(item) || (item.element.remove(), false));
}

function createQueueItem(file) {
  const item = { file, size: file.size, rawName: sanitizeName(file.name.replace(/\.mp3$/i, ''), QUEUE_NAME_MAX_BYTES) || 'faixa', status: 'check', progress: 0 };
  item.element = makeElement('li', '<div class="line"><span class="name"></span><b class="status-chip"></b></div><i class="line-progress"><i></i></i>');
  byId('queue').append(item.element);
  queue.push(item);
}

// Fila nova a cada escolha depois de um envio terminado: o que ja foi resolvido sai.
async function queueFiles(fileList) {
  if (!uploading) {
    keepOnly(item => item.status == 'wait' || item.status == 'check');
    if (!queue.length) ignoredCount = 0;
  }
  const files = Array.from(fileList).sort((a, b) =>
    (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, undefined, { numeric: true }));
  for (const file of files) {
    if (/\.mp3$/i.test(file.name)) createQueueItem(file);
    else ignoredCount++;
  }
  drawAll();
  drawLibrary();
  byId('queueSection').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
  await checkQueuedFiles();
  await assignNames(true);
}

async function checkQueuedFiles() {
  for (const item of queue.filter(queued => queued.status == 'check')) {
    if (item.size > state.lim.file) { markFailed(item, 'big'); continue; }
    item.sampleRate = await sniffSampleRate(item.file).catch(() => 0);
    if (item.sampleRate) item.status = 'wait'; else markFailed(item, 'notmp3');
    drawItem(item);
  }
}

// A pasta vira playlist: nome livre vira destino novo; nome que ja existe pergunta (padrao: a existente).
function startFolder(fileList) {
  const first = Array.from(fileList).find(file => file.webkitRelativePath);
  const folderName = first ? sanitizeName(first.webkitRelativePath.split('/')[0], state.lim.plLen) : '';
  const existing = folderName && findPlaylist(folderName);
  folderAsk = existing ? { name: folderName, existing: existing.n, fresh: uniquePlaylistName(existing.n) } : null;
  const canCreate = folderName && state.pl.length < state.lim.pl;
  newDest(existing ? existing.n : canCreate ? folderName : '');
  queueFiles(fileList);
}

// Uma fila, um destino: escolher outro destino por cartao, pasta ou playlist nova descarta o que esperava.
function newDest(playlist) {
  if (playlist != destPlaylist) {
    keepOnly(item => item.status == 'send');
    ignoredCount = 0;
  }
  setDest(playlist);
}

function setDest(playlist) {
  destPlaylist = playlist;
  byId('destPicker').textContent = '';
  byId('destination').classList.remove('flash');
  void byId('destination').offsetWidth;
  byId('destination').classList.add('flash');
  drawAll();
  drawLibrary();
  assignNames(true);
}

function markFailed(item, code) {
  item.status = 'err';
  item.errorCode = code;
  drawItem(item);
}

const highestTrackNumber = tracks => tracks.reduce((highest, track) => {
  const match = /^(\d+) - /.exec(track.n);
  return match ? Math.max(highest, +match[1]) : highest;
}, 0);

// Nome do arquivo sem o numero que o usuario ja tinha, para reaproveitar a numeracao do aparelho.
const withoutLeadingNumber = name => name.replace(/^\d{1,3}(\s*[-._)]\s*|\s+)(?=\S)/, '');

// Da o nome final a quem espera: limpa, numera depois do maior numero existente, pula quem ja esta
// na playlist (mesmo nome sem numero e mesmo tamanho) e desvia colisao para "nome 2.mp3".
async function assignNames(forceReload) {
  const playlist = destPlaylist, numbered = byId('keepOrder').checked;
  let existing = [];
  try { existing = playlist ? await fetchTracks(playlist, forceReload) : []; } catch {}
  const usedNames = new Set(existing.map(track => track.n));
  const sameTrack = new Map(existing.map(track => [stripNumberAndExtension(track.n) + '|' + track.b, track.n]));
  let lastNumber = highestTrackNumber(existing);
  queue.forEach(item => { if (item.status == 'ok' || item.status == 'send') usedNames.add(item.name); });
  let trackTotal = existing.length;
  for (const item of queue) {
    if (item.status != 'wait' && item.status != 'skip' && !(item.status == 'err' && item.errorCode == 'limit')) continue;
    const baseName = numbered ? withoutLeadingNumber(item.rawName) : item.rawName;
    const duplicate = sameTrack.get(stripNumberAndExtension(baseName + '.mp3') + '|' + item.size);
    if (duplicate) { item.status = 'skip'; item.name = duplicate; drawItem(item); continue; }
    item.status = 'wait';
    item.errorCode = '';
    if (++trackTotal > state.lim.tr) { markFailed(item, 'limit'); continue; }
    const prefix = numbered ? String(++lastNumber).padStart(2, '0') + ' - ' : '';
    item.name = uniqueTrackName(prefix, baseName, usedNames);
    usedNames.add(item.name);
    drawItem(item);
  }
  drawAll();
}

function uniqueTrackName(prefix, baseName, usedNames) {
  const room = state.lim.trLen - 4 - byteLength(prefix);
  let name = prefix + (sanitizeName(baseName, room) || 'faixa') + '.mp3';
  for (let n = 2; usedNames.has(name); n++) name = prefix + (sanitizeName(baseName, room - byteLength(' ' + n)) || 'faixa') + ' ' + n + '.mp3';
  return name;
}

function uploadFile(item, playlist, progressMeta) {
  return new Promise(resolve => {
    const request = currentRequest = new XMLHttpRequest();
    item.uploadId = ++uploadSeq;
    const query = toQueryString(Object.assign({ p: playlist, n: item.name, u: item.uploadId }, progressMeta));
    request.open('POST', '/api/upload?' + query);
    request.setRequestHeader('X-Q', query);
    request.setRequestHeader('Content-Type', 'application/octet-stream');
    request.setRequestHeader('X-Mrm', '1');
    request.upload.onprogress = e => { item.progress = e.loaded / item.size; drawItem(item); drawTotal(); };
    request.onload = () => {
      let json = {};
      try { json = JSON.parse(request.responseText); } catch {}
      resolve(request.status == 200 && json.ok ? json : { e: json.e || 'io' });
    };
    request.onerror = request.ontimeout = () => resolve({ e: 'net' });
    request.onabort = () => resolve({ e: 'cancel' });
    request.send(item.file);
  });
}

async function sendQueue() {
  const playlist = destPlaylist;
  if (!playlist) return;
  if (!findPlaylist(playlist) && state.pl.length >= state.lim.pl) return showNote('queueNote', translate('playlistsFull', state.lim.pl), true);
  folderAsk = null;
  await assignNames(true);
  const items = queue.filter(item => item.status == 'wait');
  if (!items.length) return;
  batch = { items, totalBytes: items.reduce((sum, item) => sum + item.size, 0) };
  uploading = true;
  document.body.classList.add('busy');
  setBanner('send');
  while (uploading) {
    const index = items.findIndex(item => item.status == 'wait');
    if (index < 0) break;
    await uploadNext(items, index, playlist);
  }
  finishUpload();
}

async function uploadNext(items, index, playlist) {
  const item = items[index];
  const bytesDone = items.reduce((sum, other) => sum + (other.status == 'wait' || other == item ? 0 : other.size), 0);
  item.status = 'send';
  item.progress = 0;
  drawItem(item);
  setBanner('send');
  const result = await uploadFile(item, playlist, { i: index + 1, of: items.length, tb: batch.totalBytes, ts: bytesDone });
  if (result.ok) {
    recordUploaded(item, playlist, result.free);
  } else if (result.e == 'net') {
    await recoverFromDrop(item, playlist);
  } else if (result.e == 'cancel') {
    item.status = 'wait';
  } else {
    markFailed(item, result.e);
    if (result.e == 'space') stopUpload();
  }
  drawItem(item);
  drawAll();
}

function recordUploaded(item, playlist, free) {
  item.status = 'ok';
  state.free = free;
  const entry = findPlaylist(playlist) || (state.pl.push({ n: playlist, c: 0, b: 0 }), findPlaylist(playlist));
  entry.c++;
  entry.b += item.size;
  (trackCache[playlist] = trackCache[playlist] || []).push({ n: item.name, b: item.size });
}

// Conexao caiu no meio: o aparelho pode ter recusado (fecha o socket) ou o celular dormiu.
// Volta quando /api/state responde e decide pelo que ficou gravado e por state.last.
async function recoverFromDrop(item, playlist) {
  item.status = 'wait';
  drawItem(item);
  await waitForState();
  if (!uploading) return;
  setBanner('send');
  const existing = await fetchTracks(playlist, true).catch(() => []);
  const stored = existing.find(track => track.n == item.name);
  if (stored && stored.b == item.size) item.status = 'ok';
  else if (state.lu == item.uploadId && SERVER_ERRORS_AFTER_DROP.includes(state.last)) {
    markFailed(item, state.last);
    if (state.last == 'space') stopUpload();
  } else if ((item.tries = (item.tries || 0) + 1) > MAX_NET_RETRIES) markFailed(item, 'net');
  await assignNames();
}

function stopUpload() {
  const wasUploading = uploading;
  uploading = false;
  if (currentRequest) currentRequest.abort();
  if (wasUploading) setBanner('ready');
}

async function finishUpload() {
  try { state = await api('/api/state'); } catch {}
  document.body.classList.remove('busy');
  uploading = false;
  currentRequest = null;
  const countWith = status => queue.filter(item => item.status == status).length;
  if (queue.length && !countWith('wait')) setBanner('finished', countWith('ok'), countWith('skip'), countWith('err'));
  else setBanner('ready');
  drawAll();
  drawLibrary();
}

function cancelQueue() {
  if (uploading) return stopUpload();
  queue = [];
  batch = null;
  destPlaylist = '';
  folderAsk = null;
  byId('queue').textContent = byId('destPicker').textContent = '';
  ignoredCount = 0;
  setBanner('ready');
  drawAll();
  drawLibrary();
}

function setBanner(key, ...args) {
  shownStatus = [key, args];
  const banner = byId('status');
  banner.className = key;
  if (key == 'send' && batch) {
    const finished = batch.items.filter(item => item.status != 'wait' && item.status != 'send').length;
    args = [finished + 1, batch.items.length];
  }
  banner.textContent = translate(key == 'send' ? 'sending' : key, ...args);
}

function showNote(id, text, isError) {
  const el = byId(id);
  el.hidden = !text;
  el.textContent = text || '';
  el.classList.toggle('error', !!isError);
}

function drawItem(item) {
  const chip = item.element.querySelector('.status-chip');
  const wrongRate = item.status == 'wait' && item.sampleRate && !isPlayableRate(item.sampleRate);
  item.element.querySelector('.name').textContent = item.name || item.rawName + '.mp3';
  chip.className = 'status-chip ' + (wrongRate ? 'warn' : item.status);
  chip.textContent = wrongRate ? item.sampleRate / 1000 + ' kHz' : item.status == 'send' ? Math.floor(item.progress * 100) + '%' :
    item.status == 'err' ? translate('error_' + item.errorCode) : translate(item.status);
  item.element.querySelector('.line-progress i').style.width = (item.status == 'ok' ? 100 : item.status == 'send' ? item.progress * 100 : 0) + '%';
}

function drawTotal() {
  if (!batch) return;
  let sent = 0;
  batch.items.forEach(item => sent += item.status == 'send' ? item.progress * item.size : item.status == 'wait' ? 0 : item.size);
  byId('totalBar').style.width = (sent / batch.totalBytes * 100) + '%';
}

// Linha de destino sempre visivel na fila; sem destino o envio fica desligado.
function drawDest() {
  const existing = destPlaylist && findPlaylist(destPlaylist);
  const waiting = queue.filter(item => item.status == 'wait').length;
  const checking = queue.some(item => item.status == 'check');
  byId('destination').classList.toggle('missing', !destPlaylist);
  byId('destName').textContent = destPlaylist || translate('choose');
  byId('destInfo').textContent = !destPlaylist ? (state.pl.length >= state.lim.pl ? translate('playlistsFull', state.lim.pl) : '') : existing ? translate('existing', existing.c) : translate('fresh');
  byId('destChange').textContent = translate(destPlaylist ? 'swap' : 'pick');
  byId('destChange').disabled = uploading;
  byId('send').textContent = !destPlaylist ? translate('choose') : waiting ? translate(waiting == 1 ? 'sendTo1' : 'sendTo', waiting, destPlaylist) : translate(checking ? 'check' : 'nothing');
  byId('send').disabled = uploading || !destPlaylist || !waiting || checking;
  drawFolderAsk();
}

function drawFolderAsk() {
  byId('folderAsk').hidden = !folderAsk || uploading;
  if (!folderAsk) return;
  byId('askText').textContent = translate('askText', folderAsk.name);
  byId('askExisting').textContent = translate('askExisting', folderAsk.existing);
  byId('askNew').textContent = translate('askNew', folderAsk.fresh);
  byId('askExisting').className = 'btn' + (destPlaylist == folderAsk.existing ? '' : ' ghost');
  byId('askNew').className = 'btn' + (destPlaylist == folderAsk.fresh ? '' : ' ghost');
  byId('askNew').disabled = state.pl.length >= state.lim.pl;
}

function drawSpace() {
  const used = state.total - state.free, usable = state.total - state.reserve;
  const queuedBytes = queue.reduce((sum, item) => sum + (item.status == 'wait' || item.status == 'check' || item.status == 'send' ? item.size : 0), 0);
  const overflow = used + queuedBytes - usable;
  byId('spaceUsed').style.width = used / state.total * 100 + '%';
  byId('spacePlanned').style.left = used / state.total * 100 + '%';
  byId('spacePlanned').style.width = Math.min(queuedBytes, state.total - used) / state.total * 100 + '%';
  byId('space').classList.toggle('over', overflow > 0);
  byId('spaceText').textContent = translate('space', formatSize(used), formatSize(usable), formatSize(Math.max(0, usable - used))) +
    (queuedBytes ? translate('spaceQueued', formatSize(queuedBytes)) : '') + (overflow > 0 ? translate('doesNotFit', formatSize(overflow)) : '');
}

function drawAll() {
  if (!state) return;
  byId('deviceName').textContent = state.name;
  document.title = state.name;
  drawSpace();
  byId('queueSection').hidden = !queue.length;
  queue.forEach(drawItem);
  const wrongRateCount = queue.filter(item => item.sampleRate && !isPlayableRate(item.sampleRate) && item.status != 'err').length;
  showNote('queueNote', [ignoredCount ? translate('ignored', ignoredCount) : '', wrongRateCount ? translate('rate', wrongRateCount) : ''].filter(Boolean).join(' · '));
  byId('keepOrder').disabled = uploading;
  byId('cancel').textContent = translate(uploading ? 'stop' : queue.some(item => item.status == 'wait') ? 'cancel' : 'clear');
  drawDest();
  drawTotal();
  setBanner(shownStatus[0], ...shownStatus[1]);
}

const actionButton = action => '<button class="action" data-action="' + action + '" title="' + translate(action) + '" aria-label="' + translate(action) + '">' + ICONS[action] + '</button>';

function makeTrackRow(track, actions) {
  const row = makeElement('li', '<span class="name"><span class="title"></span><small></small></span>' + actions.map(actionButton).join(''));
  row.dataset.name = track.n;
  row.querySelector('.title').textContent = track.n;
  return row;
}

// Campo de nome de playlist nova com validacao ao vivo; onTyping recebe o texto para filtrar chips.
function makeNameBox(onValid, onTyping) {
  const box = makeElement('div', '<div class="row"><input type="text" autocomplete="off"><button class="btn"></button></div><small class="hint"></small>');
  box.className = 'name-box';
  const input = box.querySelector('input'), button = box.querySelector('button'), hint = box.lastChild;
  input.placeholder = translate('playlistPlaceholder');
  button.textContent = translate('create');
  const validate = () => {
    const result = checkName(input.value);
    hint.textContent = result.kind ? translate('name_' + result.kind, result.name, state.lim.plLen, state.lim.pl) : '';
    hint.className = 'hint' + (result.kind == 'free' ? '' : ' error');
    button.disabled = result.kind != 'free';
    if (onTyping) onTyping(input.value.trim().toLowerCase());
    return result;
  };
  const submit = () => { const result = validate(); if (result.kind == 'free') onValid(result.name); };
  input.oninput = validate;
  input.onkeydown = e => e.key == 'Enter' && submit();
  button.onclick = submit;
  validate();
  if (!onTyping) setTimeout(() => input.focus());
  return box;
}

// Seletor de destino: playlists como chips grandes e "+ nova"; skip e a origem de um mover.
function togglePicker(host, skip, onChoose) {
  const existingPicker = host.querySelector('.picker');
  if (existingPicker) return existingPicker.remove();
  const picker = makeElement('div', '<div class="chips"></div>'), chips = picker.firstChild;
  picker.className = 'picker';
  state.pl.filter(pl => pl.n != skip).forEach(pl => {
    const chip = makeElement('button', '<span class="title"></span><small></small>');
    chip.className = 'chip' + (pl.n == destPlaylist && skip == null ? ' on' : '');
    chip.firstChild.textContent = pl.n;
    chip.lastChild.textContent = pl.c;
    chip.onclick = () => onChoose(pl.n);
    chips.append(chip);
  });
  const filterChips = typed => chips.childNodes.forEach(chip => chip.hidden = !chip.firstChild.textContent.toLowerCase().includes(typed));
  picker.append(makeNameBox(onChoose, filterChips));
  picker.querySelector('.btn').textContent = translate(skip == null ? 'pick' : 'move');
  picker.querySelector('input').placeholder = translate('findOrCreate');
  picker.onclick = e => e.stopPropagation();
  host.append(picker);
}

function makeCard(playlist, title, subtitle, openPlaylists) {
  const card = makeElement('div', '<div class="card-head"><button class="card-toggle"><span class="name"><span class="title"></span><small></small></span></button>' +
    (playlist ? '<button class="add-btn" data-action="add">' + translate('add') + '</button>' : '') + '</div><div class="card-body"><ul></ul>' +
    (playlist ? '<div class="card-actions"><button class="action" data-action="rename">' + translate('rename') + '</button><button class="action" data-action="delete">' + translate('delete') + '</button></div>' : '') + '</div>');
  card.className = 'card' + (playlist && playlist == destPlaylist && queue.length ? ' active' : '');
  card.dataset.playlist = playlist;
  card.querySelector('.title').textContent = title;
  card.querySelector('small').textContent = subtitle;
  if (openPlaylists.has(playlist)) toggleCard(card);
  return card;
}

function drawLibrary() {
  if (!state) return;
  const box = byId('playlists'), filter = byId('filter').value.trim().toLowerCase();
  const openPlaylists = new Set([...box.querySelectorAll('.open')].map(card => card.dataset.playlist));
  box.textContent = '';
  byId('libraryCount').textContent = translate('count', state.pl.length, state.lim.pl);
  byId('filter').hidden = state.pl.length < FILTER_MIN_PLAYLISTS;
  byId('newPlaylistBtn').disabled = state.pl.length >= state.lim.pl;
  if (!state.pl.length && !looseTracks.length) box.append(makeElement('small', translate('none')));
  if (looseTracks.length) box.append(makeCard('', translate('loose'), looseMore ? translate('more', looseTracks.length) : trackCount(looseTracks.length), openPlaylists));
  state.pl.filter(pl => !filter || pl.n.toLowerCase().includes(filter))
    .forEach(pl => box.append(makeCard(pl.n, pl.n, trackCount(pl.c) + ' · ' + formatSize(pl.b), openPlaylists)));
}

function fillLooseList(list) {
  list.textContent = '';
  for (const track of looseTracks) {
    const row = makeTrackRow(track, ['delete']);
    row.dataset.source = track.s;
    row.querySelector('small').textContent = formatSize(track.b) + ' · ' + (track.s == 'root' ? '/' : '/music');
    const moveButton = makeElement('button', translate('moveTo'));
    moveButton.className = 'action';
    moveButton.dataset.action = 'moveTo';
    row.lastChild.before(moveButton);
    list.append(row);
  }
}

function fillTrackList(list, tracks) {
  list.textContent = '';
  tracks.forEach((track, index) => {
    const row = makeTrackRow(track, ['up', 'down', 'moveTo', 'rename', 'delete']);
    row.querySelector('small').textContent = formatSize(track.b);
    row.querySelector('[data-action=up]').disabled = !index;
    row.querySelector('[data-action=down]').disabled = index == tracks.length - 1;
    list.append(row);
  });
}

async function toggleCard(card) {
  if (!card.classList.toggle('open')) return;
  const playlist = card.dataset.playlist, list = card.querySelector('ul');
  if (!playlist) return fillLooseList(list);
  let tracks = [];
  try { tracks = await fetchTracks(playlist, true); } catch { return showNote('libraryNote', translate('error_net'), true); }
  fillTrackList(list, tracks);
}

function moveTrack(playlist, row, destination) {
  const target = findPlaylist(destination);
  if (target && target.c >= state.lim.tr) return showNote('libraryNote', translate('tracksFull', state.lim.tr), true);
  const params = { p: playlist, n: row.dataset.name, to: destination };
  if (row.dataset.source) params.src = row.dataset.source;
  callAndRefresh('/api/move?' + toQueryString(params));
}

// Apagar pede segundo toque em ate ARM_CONFIRM_MS.
function confirmTwice(button, onConfirm) {
  if (button.classList.contains('armed')) { clearTimeout(button.disarmTimer); return onConfirm(); }
  const label = button.textContent;
  button.classList.add('armed');
  button.textContent = translate('sure');
  button.disarmTimer = setTimeout(() => { button.classList.remove('armed'); button.textContent = label; }, ARM_CONFIRM_MS);
}

async function callAndRefresh(path) {
  let succeeded = true;
  showNote('libraryNote');
  try {
    const result = await api(path, true);
    if (result.free != null) state.free = result.free;
  } catch (e) {
    succeeded = false;
    showNote('libraryNote', translate('error_' + (e.code || 'net')), true);
  }
  Object.keys(trackCache).forEach(key => delete trackCache[key]);
  try { state = await api('/api/state'); } catch {}
  await loadLooseTracks();
  drawAll();
  drawLibrary();
  assignNames();
  return succeeded;
}

function startRename(target, playlist, trackName) {
  const isTrack = trackName != null;
  const maxBytes = isTrack ? state.lim.trLen - 4 : state.lim.plLen;
  const oldName = isTrack ? trackName.replace(/\.mp3$/i, '') : playlist;
  const input = makeElement('input');
  input.type = 'text';
  input.value = oldName;
  target.replaceWith(input);
  input.focus();
  let finished = false;
  const finish = async commit => {
    if (finished) return;
    finished = true;
    const newName = sanitizeName(input.value, maxBytes);
    if (!commit || !newName || newName == oldName) return drawLibrary();
    const params = isTrack ? { p: playlist, n: trackName, to: newName + '.mp3' } : { p: playlist, to: newName };
    const succeeded = await callAndRefresh('/api/rename?' + toQueryString(params));
    if (succeeded && !isTrack && destPlaylist == playlist) setDest(newName);
  };
  input.onkeydown = e => { if (e.key == 'Enter') finish(true); if (e.key == 'Escape') finish(false); };
  input.onblur = () => finish(true);
}

function deleteTarget(button, playlist, row) {
  const params = row ? { p: playlist, n: row.dataset.name } : { p: playlist };
  if (row && row.dataset.source) params.src = row.dataset.source;
  confirmTwice(button, () => callAndRefresh('/api/delete?' + toQueryString(params)));
}

function swapNeighbor(action, playlist, row) {
  const neighbor = action == 'up' ? row.previousElementSibling : row.nextElementSibling;
  const names = action == 'up' ? { a: neighbor.dataset.name, b: row.dataset.name } : { a: row.dataset.name, b: neighbor.dataset.name };
  callAndRefresh('/api/swap?' + toQueryString(Object.assign({ p: playlist }, names)));
}

byId('playlists').onclick = e => {
  const button = e.target.closest('button');
  if (!button) return;
  const card = button.closest('.card'), playlist = card.dataset.playlist, row = button.closest('li');
  const trackName = row ? row.dataset.name : null, action = button.dataset.action;
  if (button.classList.contains('card-toggle')) toggleCard(card);
  else if (action == 'add') { wantedDest = playlist; byId('filesInput').click(); }
  else if (action == 'delete') deleteTarget(button, playlist, row);
  else if (action == 'up' || action == 'down') swapNeighbor(action, playlist, row);
  else if (action == 'moveTo') togglePicker(row, playlist, destination => moveTrack(playlist, row, destination));
  else startRename(row ? row.querySelector('.name') : card.querySelector('.card-toggle'), playlist, trackName);
};

byId('filesInput').onchange = e => {
  if (wantedDest != null) { folderAsk = null; newDest(wantedDest); wantedDest = null; byId('newPlaylistSlot').textContent = ''; }
  queueFiles(e.target.files);
  e.target.value = '';
};
byId('folderInput').onchange = e => { startFolder(e.target.files); e.target.value = ''; };
byId('newPlaylistBtn').onclick = () => {
  const slot = byId('newPlaylistSlot');
  if (slot.firstChild) return slot.textContent = '';
  slot.append(makeNameBox(name => { wantedDest = name; byId('filesInput').click(); }));
};
byId('destChange').onclick = () => togglePicker(byId('destPicker'), null, name => { folderAsk = null; setDest(name); });
byId('askExisting').onclick = () => setDest(folderAsk.existing);
byId('askNew').onclick = () => setDest(folderAsk.fresh);
byId('filter').oninput = drawLibrary;
byId('keepOrder').onchange = () => assignNames();
byId('send').onclick = sendQueue;
byId('cancel').onclick = cancelQueue;
byId('done').onclick = async () => {
  stopUpload();
  try { await api('/api/done', true); } catch {}
  byId('app').hidden = true;
  byId('end').hidden = false;
};
queryAll('#lang button').forEach(button => button.onclick = () => {
  try { localStorage.setItem('lang', button.dataset.lang); } catch {}
  setLang(button.dataset.lang);
});

// iOS diz ter webkitdirectory mas so escolhe arquivos.
byId('folderBtn').hidden = /iP(hone|ad)/.test(navigator.userAgent) || !('webkitdirectory' in makeElement('input'));

(async () => {
  try { state = await api('/api/state'); } catch {
    lang = pickLang();
    byId('bootOffline').textContent = translate('off');
    byId('bootOffline').hidden = false;
    await waitForState();
    shownStatus = ['ready', []];
  }
  await loadLooseTracks();
  byId('boot').hidden = byId('bootOffline').hidden = true;
  byId('app').hidden = false;
  setLang(pickLang());
})();
</script>
</body>
</html>
